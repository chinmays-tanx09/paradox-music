# Builds Paradox Music for Windows (x64 and ARM64): a setup .exe (NSIS) and an .msi for each.
# Runs when a tag like v1.0.0 is pushed, or by hand from the Actions tab (Run workflow).
# Each installer is attached to the GitHub Release and also uploaded to gofile.io; the release
# notes list every file with its size, SHA-256 and gofile link (private-repo assets need a login).
name: Build Windows installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Paradox Music $GITHUB_REF_NAME" --notes "Building… the installers appear here in a few minutes."

  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: test
      - name: Unit tests (queue, shuffle, repeat)
        run: node --test ui/test/queue.test.js
      - name: Unit tests (library scan, tags, cover art)
        run: cargo test --manifest-path src-tauri/Cargo.toml

  build:
    needs: release
    if: always() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.arch }}

      - name: Install the Tauri CLI
        run: npm install --no-audit --no-fund

      - name: Build installers
        run: npx tauri build --target ${{ matrix.target }} --bundles nsis,msi

      - name: Checksums and gofile upload
        run: |
          mkdir -p dist
          cp src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe dist/
          cp src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi dist/
          cd dist
          shopt -s nullglob
          out="links-${{ matrix.arch }}.txt"
          : > "$out"
          for f in *.exe *.msi; do
            sum=$(sha256sum "$f" | cut -d' ' -f1)
            size=$(stat -c %s "$f")
            link=""
            for url in https://upload.gofile.io/uploadfile https://store-eu-par-6.gofile.io/uploadFile; do
              for try in 1 2 3; do
                resp=$(curl -s --max-time 600 -F "file=@$f" "$url" || true)
                link=$(printf '%s' "$resp" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(JSON.parse(s).data.downloadPage||"")}catch(e){}})')
                [ -n "$link" ] && break 2
                echo "upload to $url failed (try $try): ${resp:0:200}"
                sleep 10
              done
            done
            echo "$f|$size|$sum|$link" >> "$out"
          done
          cat "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: links-${{ matrix.arch }}
          path: dist/links-*.txt

      - name: Attach installers to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.exe dist/*.msi --repo "$GITHUB_REPOSITORY" --clobber

  notes:
    needs: build
    if: always() && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: links-*
          merge-multiple: true
          path: links
      - name: Release notes with download links and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/release-notes.js links > notes.md
          cat notes.md
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
