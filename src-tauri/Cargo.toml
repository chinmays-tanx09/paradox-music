[package]
name = "paradox-music"
version = "1.1.0"
description = "Paradox Music: a minimal offline music player"
authors = ["Paradox"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "paradox_music_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.25"
walkdir = "2"
rayon = "1"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif"] }
notify = "8"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "windows")'.dependencies]
souvlaki = { version = "0.9", default-features = false }

[profile.release]
codegen-units = 4
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
debug = false

[profile.dev]
debug = 0
